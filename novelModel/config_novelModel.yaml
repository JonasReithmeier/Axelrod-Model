study_name: overnight_sweep_v1
checkpoint_dir: checkpoints/overnight_v1
steps_per_chunk: 300000
n_parallel: 23 # set to your CPU count minus 1

sweep:
  mode: grid
  params:
    p: [0.05, 0.1, 0.4] # ordered: lattice-like, small-world, near-random
    alpha: [0.5, 1.0, 2.0] # weak, medium, strong dev effect
    dis_threshold: [0.3, 0.5, 0.7] # low/mid/high cut sensitivity
    weight_mode: [0, 2, 3] # skip quadratic (too similar to linear for first pass)
    dev_mode: [0, 2, 3] # skip normal (too similar to uniform for first pass)
    dev_param: [0.15] # single value for first pass: moderate pareto/bimodal shape

fixed:
  N: 150 # large enough to be meaningful, small enough to be fast
  k: 4
  F: 5
  q: 10
  seed: 42
  max_steps: 5000000
