study_name: overnight_v4
checkpoint_dir: checkpoints/overnight_v4
steps_per_chunk: 2000000
n_parallel: 23

sweep:
  mode: grid
  n_realizations: 2
  params:
    p: [0] #[0.05, 0.1, 0.2, 0.4, 0.8] # full topology range
    weight_mode: [0, 1] # linear, quadratic
    alpha: [0.25, 0.75, 1.5] # finer resolution, especially low end
    dis_threshold: [0.3, 0.7] # finer — phase transition likely here
    dev_mode: [0, 2] # uniform vs pareto
    dev_param: [0.15]
    N: [900] # large enough that cultural drift is slow and development matters
    k: [4]
    F: [10]
    q:
      [
        10,
        20,
        40,
        80,
        120,
        160,
        200,
        300,
        400,
        600,
        800,
        1200,
        1600,
        2400,
        3200,
        4800,
        8000,
      ]

fixed:
  seed: 42
  max_steps: 200000000
