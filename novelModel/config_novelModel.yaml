study_name: overnight_v4
checkpoint_dir: checkpoints/overnight_v4
steps_per_chunk: 2000000
n_parallel: 22

sweep:
  mode: grid
  params:
    p: [0.05, 0.1, 0.2, 0.4, 0.8] # full topology range
    weight_mode: [0, 1, 2, 3] # all modes
    alpha: [0.25, 0.75, 1.5, 3.0] # finer resolution, especially low end
    dis_threshold: [0.2, 0.35, 0.5, 0.65, 0.8] # finer — phase transition likely here
    dev_mode: [0, 2] # uniform vs pareto
    dev_param: [0.15]

fixed:
  N: 800 # large enough that cultural drift is slow and development matters
  k: 4
  F: 5
  q: 10
  seed: 42
  max_steps: 200000000
