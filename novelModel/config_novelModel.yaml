study_name: overnight_v2
checkpoint_dir: checkpoints/overnight_v2
steps_per_chunk: 500000
n_parallel: 23

sweep:
  mode: grid
  params:
    # Topology
    p: [0.05, 0.15, 0.4, 0.8] # lattice → small-world → random
    # Development effect
    weight_mode: [0, 1, 2, 3] # all four modes
    alpha: [0.5, 1.5, 3.0] # weak / medium / strong
    # Dissatisfaction threshold
    dis_threshold: [0.25, 0.4, 0.6, 0.75] # tight → loose rewiring trigger
    # Inequality structure
    dev_mode: [0, 2] # uniform vs pareto (most contrast)
    dev_param: [0.15] # single shape param, expand in v3

fixed:
  N: 150
  k: 4
  F: 5
  q: 10
  seed: 42
  max_steps: 20000000
