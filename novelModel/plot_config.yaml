novel_plotter:
  input_file: "novelModel/data/results.csv"
  output_dir: "novelModel/plots/novelModel_results"

  # Global filters applied to every plot unless overridden
  global_filters:
    F: 10
    k: 4
    N: 900
    p: 0
    dev_param: 0.15

  # Define as many independent plots as you want
  plots:
    - name: "plot1_weight_mode_comparison"
      title: "Impact of Weight Mode"
      filters:
        alpha: 0.25
        dis_threshold: 0.3
        dev_mode: 0
      curve_variables:
        weight_mode: [0, 1]

    - name: "plot2_alpha_and_threshold_scaling"
      title: "Phase Transition for Varying Alpha and Threshold"
      filters:
        weight_mode: 0
        dev_mode: 0
      curve_variables:
        alpha: [0.25, 0.75, 1.5]
        dis_threshold: [0.3, 0.7]

    - name: "plot3_dev_mode_comparison"
      title: "Phase Transition for Uniform vs Pareto Dev Modes"
      filters:
        weight_mode: 0
        alpha: 0.25
        dis_threshold: 0.3
      curve_variables:
        dev_mode: [0, 2]
