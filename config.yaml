as_mobility_experiment:
  master_seed: 42
  M_realizations: 1
  max_mcs: 100000
  data_points: 1000
  db_path: data/schelling/mobility_trajectories.parquet
  plot_dir: plots/schelling/mobility
  sweep:
    L: [40]
    F: [10]
    q: [10, 100, 160, 400, 1000, 2400, 3200, 8000]
    h: [0.05, 0.5]
    T: [0.3, 0.7]

###################################################################################
schelling_plotter:
  input_file: "data/schelling/schelling_master_results.parquet"
  output_dir: "plots/task3/s_max_over_q"
  target_F: 10

  plot1_low_density:
    h: 0.05
    L_values: [30, 40]
    T_values: [0.3, 0.5, 0.7, 1.0]

  plot2_lattice_scaling:
    h: 0.5
    T: 0.3
    L_values: [30, 40]

  plot3_tolerance_scaling:
    h: 0.5
    L: 30
    T_values: [0.3, 0.5, 0.7, 1.0]

  # PLOT 4: Heatmap of S_max over q/N and T (Fixed h and L)
  plot4_heatmap_q_T:
    h: 0.5
    L: 30

  # PLOT 5: Heatmap of S_max over q/N and h (Fixed T and L)
  plot5_heatmap_q_h:
    T: 0.3
    L: 30

  # PLOT 8: Line plot varying empty density h (Fixed T and L)
  plot8_density_scaling:
    T: 0.5
    L: 30
    h_values: [0.05, 0.3, 0.5, 0.7]

  # PLOT 9: Line plot varying both T and h simultaneously (Fixed L)
  plot9_tolerance_density_scaling:
    L: 30
    T_values: [0.3, 0.5, 0.7, 1.0]
    h_values: [0.05, 0.3, 0.5, 0.7]
