grid_visualization:
  # Options: "hash", "q-base", "neighbor-similarity-hash", "neighbor-similarity-q-base"
  mode: "neighbor-similarity-q-base"
  #Options: "light", "dark", "chaotic", "vibrant"
  theme: "light"
  base_node_setting: 40000 # Increase to make all nodes bigger
  base_line_setting: 50 # Increase to make all lines thicker
  database_name: reportDatabase_task1
  #database_name: testDB

# Settings for standard single runs (main.py)
test_simulation_defaults:
  width: 10
  height: 10
  features: 5
  traits: 10
  seed: 42
  max_steps: 200000 # High limit; we rely on the frozen check
  plot_interval: 10000

