simulation:
  width: 30
  height: 30
  features: 5 # F: Number of cultural categories
  traits: 10 # q: Possible variations per category
  max_steps: 200000
  seed: 42
  plot_interval: 50000

visualization:
  # Options: "hash", "q-base", "neighbor-similarity-hash", "neighbor-similarity-q-base"
  mode: "neighbor-similarity-q-base"
  theme: "dark"
  node_size: 80
  max_line_width: 4
